# SEV SINDSERM — stack completa (app + PostgreSQL) para self-host / VPS.
# Uso:
#   1) copie .env.example para .env e preencha (pelo menos SESSION_SECRET);
#   2) docker compose up -d --build
# O contêiner do app aplica as migrações no start (prisma migrate deploy).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sindserm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}
      POSTGRES_DB: sindserm
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sindserm"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sindserm:${POSTGRES_PASSWORD:-change-me-please}@db:5432/sindserm?schema=public
      # OBRIGATÓRIO: segredo do cookie de sessão. Gere com `openssl rand -base64 48`.
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
      # Senha de admin inicial (login). Troque após o primeiro acesso.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Sindserm@2026}
      # Ano do pleito vigente (avaliado no servidor).
      NEXT_PUBLIC_CURRENT_ELECTION_YEAR: ${NEXT_PUBLIC_CURRENT_ELECTION_YEAR:-2026}
    ports:
      - "3000:3000"
    volumes:
      # Persiste as logos enviadas pelo admin entre deploys.
      - uploads:/app/public/uploads

volumes:
  db-data:
  uploads:
