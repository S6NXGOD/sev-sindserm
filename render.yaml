# Blueprint do Render (https://render.com) — Web Service (Node) + PostgreSQL.
# Importe em "Blueprints" → New Blueprint Instance apontando para este repositório.

databases:
  - name: sindserm-db
    databaseName: sindserm
    plan: free # ajuste o plano conforme a necessidade

services:
  - type: web
    name: sev-sindserm
    runtime: node
    plan: free # ajuste conforme a necessidade
    # build: gera o client e compila; em seguida aplica as migrações (o DB é
    # acessível no build do Render) e cria o admin (idempotente). Seguro repetir.
    buildCommand: npm ci && npm run build && npm run db:deploy && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /login
    # Disco persistente para as logos enviadas pelo admin.
    disk:
      name: uploads
      mountPath: /opt/render/project/src/public/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sindserm-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true # Render gera um segredo forte automaticamente
      - key: ADMIN_PASSWORD
        sync: false # opcional: defina no painel; senão o seed usa Sindserm@2026
      - key: NEXT_PUBLIC_CURRENT_ELECTION_YEAR
        value: "2026"
      - key: NODE_VERSION
        value: "20"
