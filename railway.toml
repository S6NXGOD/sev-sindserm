# Configuração de deploy na Railway (https://railway.app) — SEV SINDSERM.
#
# Build via DOCKERFILE (ver ./Dockerfile). Trocamos do Nixpacks porque ele passou
# a falhar no planejamento ("nixpacks exited with an error") após um bump de
# versão no Railway, prendendo a produção num build antigo. O Dockerfile é
# determinístico e roda `npm run build` (= `prisma generate && next build`).
#
# As MIGRAÇÕES e o SEED rodam no START (deploy), quando o banco já está online e
# conectado — por isso o `prisma migrate deploy` fica no startCommand, não no build.

[build]
# Usa o Dockerfile do repositório (imagem reprodutível, sem depender do Nixpacks).
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# O `next start` (foreground) sobe IMEDIATAMENTE e prende a porta (env PORT) —
# NADA pode bloquear isso. As redes de segurança do banco rodam em SEGUNDO PLANO:
#   - migrate deploy: as migrações já são aplicadas MANUALMENTE antes do push
#     (fluxo documentado); aqui é só no-op quando não há pendências.
#   - seed: cria o admin (idempotente); já existe em produção.
# POR QUÊ em background: na imagem Docker o processo do engine do Prisma não
# encerra limpo (filho do PID 1 do container) e o `migrate deploy` FICAVA PENDURADO
# depois de concluir, travando o `&&` e impedindo o `next start` de subir (→ 502).
# Em background, mesmo que pendure, o app já está no ar. Seguro porque no boot
# nunca há migração pendente (aplicamos manualmente antes).
startCommand = "(npm run db:deploy || true; npm run db:seed || true) & npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
