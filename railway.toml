# Configuração de deploy na Railway (https://railway.app) — SEV SINDSERM.
#
# Build via DOCKERFILE (ver ./Dockerfile). Trocamos do Nixpacks porque ele passou
# a falhar no planejamento ("nixpacks exited with an error") após um bump de
# versão no Railway, prendendo a produção num build antigo. O Dockerfile é
# determinístico e roda `npm run build` (= `prisma generate && next build`).
#
# As MIGRAÇÕES e o SEED rodam no START (deploy), quando o banco já está online e
# conectado — por isso o `prisma migrate deploy` fica no startCommand, não no build.

[build]
# Usa o Dockerfile do repositório (imagem reprodutível, sem depender do Nixpacks).
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Comando de start SIMPLES e à prova de parse. Em deploy por DOCKERFILE, o Railway
# roda o startCommand em EXEC FORM (sem shell) — operadores como `&&`, `||`, `;`,
# `(subshell)` e `&` NÃO são válidos aqui e quebram a criação do container
# ("Failed to parse start command").
#
# `next start` sobe direto e prende a porta pela env PORT (o Next lê PORT sozinho).
#
# As migrações NÃO rodam mais no boot: são aplicadas MANUALMENTE contra a produção
# ANTES de cada push (ver memória "deploy-seguro-migracoes"). O admin já existe, então
# o seed também sai do boot. Isto remove a etapa de banco que, na imagem Docker,
# PENDURAVA (engine do Prisma não encerra como filho do PID 1) e travava o start (→ 502).
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
